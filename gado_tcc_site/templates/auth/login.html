{% load static %}
<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — GadoManager</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>

<body style="background: linear-gradient(135deg,#ffffff,#ffffff); min-height:100vh; display:flex; align-items:center;">

  <div class="container" style="max-width:520px;">
    
    <div class="text-center mb-4">
      <div class="d-inline-flex align-items-center gap-2 px-3 py-2 rounded-4"
           style="background:rgba(235, 235, 235, 0.75); border:1px solid rgb(156, 156, 156);">
        <span style="font-size:1.4rem;">🐄</span>
        <span class="fw-bold">GadoManager</span>
      </div>
      <div class="text-secondary small mt-2">
        Sistema web de gestão do rebanho
      </div>
    </div>

    <div class="cardx">
      <div class="card-body p-4 p-md-5">

        <h5 class="mb-3">Entrar no sistema</h5>

        {% if messages %}
          {% for message in messages %}
            <div class="alert alert-danger">{{ message }}</div>
          {% endfor %}
        {% endif %}

        <form method="post" class="mt-3">
          {% csrf_token %}

          <div class="mb-3">
            <label class="form-label fw-semibold">Usuário</label>
            <input class="form-control" name="username" autocomplete="username" required>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Senha</label>
            <input class="form-control" name="password" type="password" autocomplete="current-password" required>
          </div>

          <button class="btn btn-brand w-100 py-2">
            <i class="bi bi-box-arrow-in-right me-2"></i> Entrar
          </button>

          <div class="mt-3 small text-secondary text-center">
            Demo: <code>demo</code> / <code>demo12345</code>
          </div>

        </form>

      </div>
    </div>

    <div class="text-center mt-3 small text-secondary">
      © {% now "Y" %} GadoManager
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
