{% extends 'base.html' %}
{% block content %}
<div class="page-title">
  <h3 class="mb-0">{{ title }}</h3>
  <div class="d-flex gap-2">
    <a class="btn btn-outline-secondary" href="{% url 'reminders_export_csv' %}">Exportar CSV</a>
    <a class="btn btn-primary" href="{% url 'reminders_export_pdf' %}">PDF</a>
  </div>
</div>

<div class="card border-0 shadow-sm">
  <div class="card-body">
    <div class="table-responsive">
      <table class="table table-hover align-middle">
        <thead>
          <tr><th>Tipo</th><th>Animal</th><th>Nome</th><th>Vencimento</th><th>Obs</th></tr>
        </thead>
        <tbody>
          {% for i in items %}
          <tr>
            <td><span class="badge text-bg-{% if i.type == 'Vacina' %}primary{% else %}warning{% endif %}">{{ i.type }}</span></td>
            <td>{{ i.animal }}</td>
            <td>{{ i.name }}</td>
            <td><b>{{ i.due }}</b></td>
            <td class="text-secondary">{{ i.notes|default:"" }}</td>
          </tr>
          {% empty %}
          <tr><td colspan="99" class="text-center text-secondary py-4">Nada a vencer nos próximos 30 dias.</td></tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %}
