{% extends 'base.html' %}
{% block content %}
<div class="page-title">
  <h3 class="mb-0">Tratamentos</h3>
  <a class="btn btn-primary" href="{% url 'treatment_create' %}"><i class="bi bi-plus-lg me-1"></i>Novo</a>
</div>

<div class="card border-0 shadow-sm">
  <div class="card-body">
    <div class="table-responsive">
      <table class="table table-hover align-middle">
        <thead><tr><th>Animal</th><th>Tipo</th><th>Produto</th><th>Data</th><th>Próximo</th><th class='text-end'>Ações</th></tr></thead>
        <tbody>
          {% for i in items %}
          <tr>
            <td>{{ i.animal }}</td><td>{{ i.kind }}</td><td>{{ i.product }}</td><td>{{ i.date }}</td><td>{{ i.next_due }}</td>
            <td class="text-end">
              <a class="btn btn-sm btn-outline-secondary" href="{% url 'treatment_edit' i.id %}">Editar</a>
              <a class="btn btn-sm btn-outline-danger" href="{% url 'treatment_delete' i.id %}">Remover</a>
            </td>
          </tr>
          {% empty %}
          <tr><td colspan="99" class="text-center text-secondary py-4">Sem registros.</td></tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %}
