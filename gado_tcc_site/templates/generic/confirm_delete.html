{% extends 'base.html' %}
{% block content %}
<div class="page-title">
  <h3 class="mb-0">Remover {{ title }}</h3>
  <a class="btn btn-outline-secondary" href="javascript:history.back()"><i class="bi bi-arrow-left me-1"></i>Voltar</a>
</div>

<div class="card border-0 shadow-sm">
  <div class="card-body p-4">
    <div class="alert alert-warning">
      Tem certeza que quer remover: <b>{{ object }}</b>?
    </div>
    <form method="post" class="d-flex gap-2">
      {% csrf_token %}
      <button class="btn btn-danger"><i class="bi bi-trash3 me-1"></i>Remover</button>
      <a class="btn btn-outline-secondary" href="javascript:history.back()">Cancelar</a>
    </form>
  </div>
</div>
{% endblock %}
